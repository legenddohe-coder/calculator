name: Build and Release Calculator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Self-Contained Binary
        run: |
          dotnet publish calculator/calculator.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            -o ./release

      - name: Create Zip Archive
        run: |
          Compress-Archive -Path ./release/calculator.exe -DestinationPath ./release/Calculator-Windows-x64.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./release/calculator.exe
            ./release/Calculator-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
